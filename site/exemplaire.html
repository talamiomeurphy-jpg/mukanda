<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Exemplaire · Mukanda</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='%236C5CE7'/%3E%3Cpath d='M14 26c6-3 12-3 18 0 6-3 12-3 18 0v20c-6-3-12-3-18 0-6-3-12-3-18 0Z' fill='white'/%3E%3Cpath d='M32 26v20' stroke='%236C5CE7' stroke-width='3'/%3E%3Cpath d='M32 8l3 6 6.5.9-4.7 4.5 1.1 6.4-5.9-3.1-5.9 3.1 1.1-6.4-4.7-4.5L29 14Z' fill='%23FFB703'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="registre.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101A3E;--ink-3:#0B1233;--violet:#6C5CE7;--blue:#2F6BFF;--gold:#FFB703;--teal:#06C39A;--coral:#FF5D73;
--paper:#F7F8FF;--card:#fff;--surface:#F1F3FA;--grey:#5A6478;--grey-2:#98A2B8;--line:#E6EAF6;
--grad:linear-gradient(135deg,var(--violet),var(--blue));--r:16px;--r-lg:22px;
--sh:0 6px 18px rgba(16,26,62,.08);--sh-lg:0 14px 34px rgba(16,26,62,.14);--sh-xl:0 26px 60px rgba(16,26,62,.22);--tr:all .25s cubic-bezier(.4,0,.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--surface);color:var(--ink);line-height:1.6}
h1,h2,h3{font-family:'Baloo 2',cursive;line-height:1.2}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:14px;font-weight:800;font-size:15px;padding:13px 24px;border:2px solid transparent;transition:var(--tr);white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--ink);border-color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.btn-grad{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.4)}
.btn-grad:hover{transform:translateY(-3px)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink);background:#fff}
.btn-sm{padding:9px 16px;font-size:13.5px;border-radius:11px;box-shadow:none}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* Barre de contexte sous le header */
.ctx{padding:112px 0 18px;background:linear-gradient(150deg,#141B4D,#3A2E8C 60%,#2F6BFF);color:#fff;position:relative}
.ctx::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--coral),var(--violet))}
.ctx-in{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.bread{display:inline-flex;gap:8px;font-size:12.5px;color:#B9C4E6;margin-bottom:8px;flex-wrap:wrap}
.bread a{color:#B9C4E6}.bread a:hover{color:var(--gold)}
.ctx h1{font-size:clamp(22px,4vw,32px)}
.ctx .pills{display:flex;gap:8px;flex-wrap:wrap}
.pill-m{padding:8px 14px;border-radius:99px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);color:#fff;transition:var(--tr)}
.pill-m:hover{background:rgba(255,255,255,.22)}
.pill-m.on{background:var(--gold);color:var(--ink);border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}

/* Layout */
.layout{display:grid;grid-template-columns:1fr 330px;gap:24px;max-width:1180px;margin:0 auto;padding:26px 20px 100px;align-items:start}
.desk{background:radial-gradient(circle at 50% 0%,#e8ebf5,#dfe3ee 70%);border:2px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-lg)}
.sheet-wrap{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 18px 50px rgba(16,26,62,.28);background:#fff;margin:0 auto}
#sheet{transform-origin:top left}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:12.5px;font-weight:800;color:var(--grey)}
.toolbar .live{display:inline-flex;align-items:center;gap:6px;color:var(--teal)}
.toolbar .live i{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.action-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.action-bar .hint{font-size:12.5px;color:var(--grey);flex:1;min-width:200px}

/* Rail droit */
.price-card{background:#fff;border:3px solid var(--ink);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-xl);position:relative;overflow:hidden;margin-bottom:14px}
.price-card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:var(--gold)}
.price-card .kick{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--violet);margin:4px 0 8px}
.price-card .amount{font-family:'Baloo 2';font-size:38px;font-weight:800;line-height:1}
.price-card .amount small{font-size:14px;color:var(--grey);font-family:'Nunito Sans';font-weight:700}
.price-card ul{list-style:none;margin:14px 0 16px;padding:0}
.price-card li{font-size:13px;font-weight:700;color:var(--grey);padding:5px 0;display:flex;gap:8px}
.price-card li::before{content:'✓';color:var(--teal);font-weight:800}
.price-card .btn{margin-bottom:8px}
.price-card .secure{font-size:11.5px;color:var(--grey-2);text-align:center}
.side-card{background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.side-card h3{font-size:16px;margin-bottom:8px}
.side-card p{font-size:13px;color:var(--grey);line-height:1.6}
.switch-list{display:flex;flex-direction:column;gap:6px}
.switch-list a{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;font-weight:800;font-size:13px;color:var(--grey);transition:var(--tr)}
.switch-list a:hover{border-color:var(--violet);color:var(--ink)}
.switch-list a.on{border-color:var(--ink);background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.switch-list .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Drawer */
.drawer-ov{position:fixed;inset:0;background:rgba(11,18,51,.55);opacity:0;visibility:hidden;transition:var(--tr);z-index:410}
.drawer-ov.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);background:var(--paper);z-index:420;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(16,26,62,.3)}
.drawer.show{transform:none}
.drawer-head{padding:18px 20px;background:linear-gradient(150deg,#141B4D,#3A2E8C);color:#fff;display:flex;align-items:center;justify-content:space-between}
.drawer-head h2{color:#fff;font-size:17px}
.drawer-head p{font-size:12px;color:#C7D0EA}
.drawer-head button{color:#fff;font-size:22px;padding:4px 10px}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px 30px}
.f-group{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.f-group h4{font-family:'Baloo 2';font-size:14px;color:var(--violet);margin-bottom:10px}
.f-row{margin-bottom:10px}
.f-row label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);margin-bottom:4px}
.f-row input,.f-row textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;font-size:13.5px;font-family:inherit;color:var(--ink)}
.f-row input:focus,.f-row textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(108,92,231,.13)}
.f-row textarea{resize:vertical;min-height:64px;line-height:1.5}
.drawer-foot{padding:14px 20px;border-top:2px solid var(--line);background:#fff}

/* Modale paiement */
.modal-ov{position:fixed;inset:0;background:rgba(11,18,51,.6);opacity:0;visibility:hidden;transition:var(--tr);z-index:430;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-ov.show{opacity:1;visibility:visible}
.modal{background:#fff;border:3px solid var(--ink);border-radius:var(--r-lg);max-width:460px;width:100%;padding:26px;box-shadow:var(--sh-xl);max-height:92vh;overflow-y:auto;position:relative}
.modal .close{position:absolute;top:12px;right:12px;font-size:20px;color:var(--grey);padding:4px 10px}
.modal h2{font-size:20px;margin-bottom:4px;padding-right:30px}
.modal .msub{font-size:13px;color:var(--grey);margin-bottom:16px}
.modal .recap{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.modal .recap .em{font-size:30px}
.modal .recap .tt{font-weight:800;font-size:13.5px}
.modal .recap .mt{font-size:11.5px;color:var(--grey)}
.modal .recap .pr{margin-left:auto;font-family:'Baloo 2';font-weight:800;font-size:19px;background:var(--gold);border:2px solid var(--ink);border-radius:10px;padding:4px 12px;white-space:nowrap}
.modal label{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--grey);margin:12px 0 6px}
.tel-box{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.tel-box:focus-within{border-color:var(--violet)}
.tel-box .prefix{padding:12px;background:var(--surface);border-right:2px solid var(--line);font-weight:800;color:var(--grey);font-size:14px}
.tel-box input{flex:1;border:none;outline:none;padding:12px;font-size:16px;font-weight:700;font-family:inherit;letter-spacing:1px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{position:relative;border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:13.5px;background:#fff;cursor:pointer;color:var(--grey);transition:var(--tr)}
.op input{position:absolute;opacity:0}
.op .dot{width:11px;height:11px;border-radius:50%}
.op.mtn .dot{background:#FFCC00}.op.air .dot{background:#E40000}
.op.sel.mtn{background:#FFF8E1;border-color:#FFCC00;color:var(--ink)}
.op.sel.air{background:#FFEBEB;border-color:#E40000;color:var(--ink)}
.status{display:none;margin-top:14px;border-radius:14px;padding:14px;font-size:13.5px;font-weight:700;align-items:flex-start;gap:12px}
.status.show{display:flex;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.status .ic{font-size:26px;flex-shrink:0}
.status.ring{background:#FFF8E1;border:2px solid var(--gold);color:#8a6d00}
.status.ring .ic{animation:ring 1.1s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.status.ok{background:#E4FBF3;border:2px solid var(--teal);color:#047857}
.status.err{background:#FFEBEE;border:2px solid var(--coral);color:#be123c}
.status .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.status .act button{background:#fff;border:2px solid currentColor;border-radius:10px;padding:7px 12px;font-weight:800;font-size:12px;color:inherit}

.fab{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;align-items:center;gap:10px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:14px 22px;font-weight:800;font-size:15px;box-shadow:0 6px 0 var(--ink),0 18px 40px rgba(16,26,62,.35);transition:var(--tr)}
.fab:hover{transform:translateY(-3px)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:14px 26px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:var(--tr);z-index:500;border:2px solid var(--gold)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{background:var(--ink-3);color:#AEB6C8}
.foot-bottom{padding:20px;text-align:center;font-size:12.5px;color:#7A8294}
@media(max-width:1024px){.layout{grid-template-columns:1fr}}
@media(max-width:640px){.fab .lbl{display:none}.fab{padding:16px}}
</style></head>
<body data-header="force">
<main id="contenu"></main>

<div class="drawer-ov" id="drawerOv"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><div><h2>✏️ Personnalise ton document</h2><p>L'aperçu se met à jour en direct.</p></div><button id="drawerClose">✕</button></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot"><button class="btn btn-grad btn-block" id="drawerOk">✅ J'ai terminé</button></div>
</aside>

<div class="modal-ov" id="payOv">
  <div class="modal">
    <button class="close" id="payClose">✕</button>
    <h2>📥 Télécharger pour <span id="mPrix" style="color:var(--violet)">200 F</span> seulement</h2>
    <div class="msub">Paiement Mobile Money · PDF personnalisé généré immédiatement.</div>
    <div class="recap"><span class="em" id="mEm">📄</span><div><div class="tt" id="mTitre">—</div><div class="mt" id="mMeta">—</div></div><span class="pr" id="mPrice">—</span></div>
    <label>Ton numéro Mobile Money</label>
    <div class="tel-box"><span class="prefix">+242</span><input type="tel" id="mTel" maxlength="9" placeholder="6 51 86 967" inputmode="numeric"></div>
    <label>Opérateur</label>
    <div class="ops">
      <label class="op mtn sel" onclick="selOp(this)"><input type="radio" name="mop" value="MTN" checked><span class="dot"></span>MTN MoMo</label>
      <label class="op air" onclick="selOp(this)"><input type="radio" name="mop" value="AIRTEL"><span class="dot"></span>Airtel Money</label>
    </div>
    <button class="btn btn-gold btn-block" id="mPay" style="margin-top:16px;padding:15px">🛒 Payer et télécharger</button>
    <div class="status" id="mStatus"></div>
    <div style="margin-top:12px;font-size:11.5px;color:var(--grey-2);text-align:center">🔒 Paiement sécurisé OpenPay · retrouvable 48 h</div>
  </div>
</div>

<button class="fab" id="fab" style="display:none"><span>📥</span><span class="lbl">Télécharger</span></button>
<footer><div class="foot-bottom">© 2026 Mukanda · Brazzaville, Congo · Un projet de l'équipe Meurphy</div></footer>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="header.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="registre.js"></script>
<script>
const FN='https://wyfkogowsdbxctbpfuud.functions.supabase.co';
const SB_URL='https://wyfkogowsdbxctbpfuud.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5ZmtvZ293c2RieGN0YnBmdXVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDc3MjAsImV4cCI6MjEwNjI4MzcyMH0.231eQ38RFvFaH3O6D-ReA8rlf3TehvWfcM-LBWocNEM';
const sb=window.supabase?supabase.createClient(SB_URL,SB_KEY):null;
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const fcfa=n=>new Intl.NumberFormat('fr-FR').format(n||0)+' F';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}

const params=new URLSearchParams(location.search);
const TYPE=params.get('type')||'';
let MODELE=parseInt(params.get('modele')||'1',10);
const DOC=window.REGISTRE[TYPE];
let DATA=null,PAY_ROW=null,pollTimer=null,pdfDone=false;

function selOp(el){document.querySelectorAll('.op').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');el.querySelector('input').checked=true;}
window.selOp=selOp;

if(!DOC){location.href='exemplaires.html?type=cv-modernes';}
else{
  if(!DOC.modeles.find(m=>m.id===MODELE))MODELE=DOC.modeles[0].id;
  DATA=JSON.parse(JSON.stringify(DOC.defaut));
  build();
}

function fit(){
  const wrap=$('#sheetWrap'),sheet=$('#sheet');
  if(!wrap||!sheet)return;
  const s=Math.min(1,wrap.clientWidth/sheet.offsetWidth);
  sheet.style.transform='scale('+s+')';
  wrap.style.height=(sheet.offsetHeight*s)+'px';
}
window.addEventListener('resize',fit);
function renderSheet(){$('#sheet').innerHTML=DOC.modeles.find(m=>m.id===MODELE).rendu(DATA);requestAnimationFrame(fit);}

function build(){
  document.title=DOC.modeles.find(m=>m.id===MODELE).nom+' · '+DOC.titre+' · Mukanda';
  $('#contenu').innerHTML=`
  <section class="ctx"><div class="wrap ctx-in">
    <div>
      <div class="bread"><a href="index.html">🏠 Accueil</a><span>›</span><a href="exemplaires.html?type=${TYPE}">${DOC.titre}</a><span>›</span><span>${DOC.modeles.find(m=>m.id===MODELE).nom}</span></div>
      <h1>${DOC.em} ${DOC.titre}</h1>
    </div>
    <div class="pills" id="pills">
      ${DOC.modeles.map(m=>`<button class="pill-m ${m.id===MODELE?'on':''}" data-m="${m.id}">${m.id} · ${m.nom}</button>`).join('')}
    </div>
  </div></section>

  <div class="layout">
    <div>
      <div class="desk">
        <div class="toolbar"><span>👁️ Aperçu réel — modèle ${DOC.modeles.find(m=>m.id===MODELE).nom}</span><span class="live"><i></i> Mise à jour en direct</span></div>
        <div class="sheet-wrap" id="sheetWrap"><div id="sheet" class=""></div></div>
        <div class="action-bar">
          <button class="btn btn-grad" id="btnUse">✏️ Utiliser — mes infos</button>
          <span class="hint">Personnalise gratuitement. Tu ne paies qu'au téléchargement.</span>
          <button class="btn btn-gold" id="btnDl">📥 Télécharger · ${fcfa(DOC.prixUnit)}</button>
        </div>
      </div>
    </div>
    <aside>
      <div class="price-card">
        <div class="kick">💳 Téléchargement personnalisé</div>
        <div class="amount">${fcfa(DOC.prixUnit)} <small>/ document</small></div>
        <ul><li>PDF A4 généré avec TES infos</li><li>Génération immédiate après paiement</li><li>MoMo / Airtel en 15 secondes</li><li>Retrouvable 48 h avec ton numéro</li></ul>
        <button class="btn btn-gold btn-block" id="sideDl">📥 Télécharger maintenant</button>
        <button class="btn btn-ghost btn-block" id="sideUse">✏️ D'abord personnaliser</button>
        <div class="secure">🔒 Paiement sécurisé OpenPay</div>
      </div>
      <div class="side-card">
        <h3>🔀 Changer de modèle</h3>
        <div class="switch-list">
          ${DOC.modeles.map(m=>`<a href="exemplaire.html?type=${TYPE}&modele=${m.id}" class="${m.id===MODELE?'on':''}"><span class="dot" style="background:${m.color}"></span>${m.nom}</a>`).join('')}
        </div>
      </div>
      <div class="side-card">
        <h3>💎 Le pack complet</h3>
        <p>Les ${DOC.modeles.length} modèles + guide pour <b>${fcfa(DOC.prixPack)}</b>.</p>
        <a class="btn btn-grad btn-block btn-sm" style="margin-top:12px" href="exemplaires.html?type=${TYPE}">Voir le pack →</a>
      </div>
      <div class="side-card">
        <h3>💬 Besoin d'aide ?</h3>
        <p>On t'aide en direct sur WhatsApp, gratuitement.</p>
        <a class="btn btn-ghost btn-block btn-sm" style="margin-top:12px" href="https://wa.me/242065186967" target="_blank" rel="noopener">Écrire sur WhatsApp</a>
      </div>
    </aside>
  </div>`;
  renderSheet();
  $('#fab').style.display='flex';
  $('#pills').addEventListener('click',e=>{
    const b=e.target.closest('.pill-m');if(!b)return;
    location.href='exemplaire.html?type='+TYPE+'&modele='+b.dataset.m;
  });
  $('#btnUse').addEventListener('click',openDrawer);
  $('#sideUse').addEventListener('click',openDrawer);
  $('#btnDl').addEventListener('click',openPay);
  $('#sideDl').addEventListener('click',openPay);
  $('#fab').addEventListener('click',openPay);
  (async()=>{if(sb){const r=await sb.from('documents').select('*').eq('slug','ex-'+TYPE).maybeSingle();PAY_ROW=r.data||null;}})();
}

/* ---- Drawer ---- */
function openDrawer(){$('#drawerBody').innerHTML=R_formulaire(DOC,DATA);$('#drawer').classList.add('show');$('#drawerOv').classList.add('show');document.body.style.overflow='hidden';
  $('#drawerBody').addEventListener('input',e=>{
    const el=e.target,p=el.dataset.p;if(!p)return;
    if(el.dataset.split)R_set(DATA,p,el.value.split('\n').map(s=>s.trim()).filter(Boolean));
    else R_set(DATA,p,el.value);
    renderSheet();
  });}
function closeDrawer(){$('#drawer').classList.remove('show');$('#drawerOv').classList.remove('show');document.body.style.overflow='';}
$('#drawerClose').addEventListener('click',closeDrawer);
$('#drawerOv').addEventListener('click',closeDrawer);
$('#drawerOk').addEventListener('click',()=>{closeDrawer();toast('✅ Document à jour !');});

/* ---- Paiement ---- */
function openPay(){
  if(!PAY_ROW){toast('⚠️ Produit 200 F non configuré (SQL ex-…).');return;}
  $('#mEm').textContent=DOC.em;
  $('#mTitre').textContent=DOC.titre+' — '+DOC.modeles.find(m=>m.id===MODELE).nom;
  $('#mMeta').textContent='PDF personnalisé · '+DATA.nom;
  $('#mPrice').textContent=fcfa(PAY_ROW.prix_fcfa);
  $('#mPrix').textContent=fcfa(PAY_ROW.prix_fcfa);
  $('#mStatus').className='status';
  const saved=localStorage.getItem('mukanda_tel');if(saved)$('#mTel').value=saved.replace(/^0/,'');
  $('#payOv').classList.add('show');document.body.style.overflow='hidden';
}
function closePay(){$('#payOv').classList.remove('show');document.body.style.overflow='';}
$('#payClose').addEventListener('click',closePay);
$('#payOv').addEventListener('click',e=>{if(e.target.id==='payOv')closePay();});
function mStatus(c,i,h,a){const s=$('#mStatus');s.className='status show '+c;s.innerHTML=`<span class="ic">${i}</span><div>${h}${a?`<div class="act">${a}</div>`:''}</div>`;}

$('#mPay').addEventListener('click',async()=>{
  let t=$('#mTel').value.replace(/\D/g,'');
  if(t.length===9&&t[0]==='0')t=t.slice(1);
  if(t.length!==9){mStatus('err','⚠️','Numéro invalide — 9 chiffres.');return;}
  const tel='0'+t;localStorage.setItem('mukanda_tel',tel);
  const prov=document.querySelector('#payOv .op input:checked').value;
  const btn=$('#mPay');btn.disabled=true;btn.textContent='⏳ Envoi à OpenPay…';
  mStatus('ring','📡','Contact du service de paiement…');
  try{
    const r=await fetch(FN+'/mukanda-pay',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({produit_type:'document',produit_id:PAY_ROW.id,telephone:tel,provider:prov})});
    const d=await r.json();
    if(r.ok&&d.ok){mStatus('ring','📲','<b>Ton téléphone sonne !</b> Valide le paiement '+prov+'.');surveiller(tel);}
    else if(d.openpay_status){mStatus('ring','⏰','<b>Pas de validation à temps.</b> Si tu viens de valider :',
      `<button onclick="surveiller('${tel}')">✅ J'ai validé</button>`);}
    else mStatus('err','❌',d.error||'Erreur de paiement.');
  }catch(e){mStatus('err','❌','Connexion impossible.');}
  finally{btn.disabled=false;btn.textContent='🛒 Payer et télécharger';}
});
function surveiller(tel){
  clearInterval(pollTimer);let n=0;pdfDone=false;
  mStatus('ring','📲','<b>Vérification…</b> ton PDF se génère dès confirmation.');
  pollTimer=setInterval(async()=>{
    n++;
    try{
      const r=await fetch(FN+'/mukanda-download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telephone:tel})});
      if(r.ok){const d=await r.json();
        if(d.liens&&d.liens.length){clearInterval(pollTimer);
          mStatus('ok','🎉','<b>Paiement confirmé !</b> Ton PDF arrive…',`<button onclick="genererPDF()">📥 Re-télécharger</button>`);
          if(!pdfDone){pdfDone=true;setTimeout(genererPDF,600);}return;}}
    }catch(e){}
    if(n>=45){clearInterval(pollTimer);mStatus('err','⏰','Délai dépassé. Validé sur ton téléphone ?',`<button onclick="surveiller('${tel}')">🔍 Revérifier</button>`);}
  },4000);
}
window.surveiller=surveiller;

async function genererPDF(){
  const sheet=$('#sheet'),wrap=$('#sheetWrap');
  toast('🖨️ Génération du PDF…');
  const pT=sheet.style.transform,pH=wrap.style.height;
  sheet.style.transform='none';wrap.style.height='auto';
  const fname=('Mukanda-'+TYPE+'-'+DATA.nom).replace(/[^\w\-]+/g,'-').replace(/-+/g,'-')+'.pdf';
  try{
    await html2pdf().set({margin:0,filename:fname,html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:794},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(sheet).save();
    toast('📥 PDF téléchargé !');
  }catch(e){toast('❌ Erreur PDF.');}
  sheet.style.transform=pT;wrap.style.height=pH;
}
window.genererPDF=genererPDF;
</script>
<script src="header.js"></script>
