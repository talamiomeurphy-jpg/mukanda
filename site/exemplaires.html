<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Exemplaires · Mukanda</title>
<meta name="description" id="metaDesc" content="Choisis ton modèle professionnel Mukanda.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='%236C5CE7'/%3E%3Cpath d='M14 26c6-3 12-3 18 0 6-3 12-3 18 0v20c-6-3-12-3-18 0-6-3-12-3-18 0Z' fill='white'/%3E%3Cpath d='M32 26v20' stroke='%236C5CE7' stroke-width='3'/%3E%3Cpath d='M32 8l3 6 6.5.9-4.7 4.5 1.1 6.4-5.9-3.1-5.9 3.1 1.1-6.4-4.7-4.5L29 14Z' fill='%23FFB703'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="registre.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101A3E;--ink-3:#0B1233;--violet:#6C5CE7;--blue:#2F6BFF;--gold:#FFB703;--teal:#06C39A;--coral:#FF5D73;
--paper:#F7F8FF;--card:#fff;--surface:#F1F3FA;--grey:#5A6478;--grey-2:#98A2B8;--line:#E6EAF6;
--grad:linear-gradient(135deg,var(--violet),var(--blue));--r:16px;--r-lg:22px;
--sh:0 6px 18px rgba(16,26,62,.08);--sh-lg:0 14px 34px rgba(16,26,62,.14);--sh-xl:0 26px 60px rgba(16,26,62,.22);--tr:all .25s cubic-bezier(.4,0,.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
h1,h2,h3{font-family:'Baloo 2',cursive;line-height:1.2}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:14px;font-weight:800;font-size:15px;padding:13px 24px;border:2px solid transparent;transition:var(--tr);white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--ink);border-color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.btn-grad{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.4)}
.btn-grad:hover{transform:translateY(-3px)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{padding:9px 16px;font-size:13.5px;border-radius:11px;box-shadow:none}
.btn-block{width:100%}

/* Hero compact */
.g-hero{padding:128px 0 34px;background:linear-gradient(150deg,#141B4D,#3A2E8C 55%,#2F6BFF);color:#fff;position:relative;overflow:hidden}
.g-hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--gold),var(--coral),var(--violet))}
.g-hero-in{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.bread{display:inline-flex;gap:8px;font-size:13px;color:#B9C4E6;margin-bottom:10px;flex-wrap:wrap}
.bread a{color:#B9C4E6}.bread a:hover{color:var(--gold)}
.g-hero h1{font-size:clamp(28px,4.5vw,42px)}
.g-hero .sub{color:#D5DCF0;font-size:15px;max-width:620px;margin-top:8px}
.g-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px}
.g-stats .num{font-family:'Baloo 2';font-size:26px;font-weight:800;color:var(--gold);display:block;line-height:1}
.g-stats .lbl{font-size:11.5px;color:#A9B4D6}

/* Pack card */
.pack{background:#fff;border-radius:var(--r-lg);border:3px solid var(--ink);box-shadow:var(--sh-xl);padding:22px;max-width:340px;position:relative;overflow:hidden}
.pack::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:var(--gold)}
.pack .kick{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--violet);margin:4px 0 6px}
.pack h3{font-size:19px;margin-bottom:6px}
.pack p{font-size:13px;color:var(--grey);margin-bottom:12px}
.pack li{list-style:none;font-size:13px;font-weight:700;color:var(--grey);padding:4px 0;display:flex;gap:8px}
.pack li::before{content:'✓';color:var(--teal);font-weight:800}
.pack .row{display:flex;align-items:baseline;gap:10px;margin:12px 0}
.pack .now{font-family:'Baloo 2';font-size:32px;font-weight:800}
.pack .old{color:var(--grey-2);text-decoration:line-through;font-size:14px}
.pack .save{background:var(--coral);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}

/* Grille modèles avec VRAIS aperçus */
.grid-sec{padding:44px 0 70px}
.grid-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.grid-head h2{font-size:clamp(22px,4vw,30px)}
.grid-head .sub{color:var(--grey);font-size:14px;margin-top:4px}
.m-grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.m-card{background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh);transition:var(--tr);display:block}
.m-card:hover{transform:translateY(-6px);box-shadow:var(--sh-xl);border-color:var(--violet)}
.m-prev{height:230px;overflow:hidden;position:relative;background:#eef0f7;border-bottom:2px solid var(--line)}
.m-prev .m-scale{position:absolute;top:0;left:0;transform-origin:top left;pointer-events:none}
.m-prev .badge{position:absolute;top:12px;right:12px;z-index:2;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:99px;font-size:11px;font-weight:800;padding:4px 12px;box-shadow:0 3px 0 var(--ink)}
.m-prev .voir{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(16,26,62,.85));color:#fff;font-weight:800;font-size:13px;padding:26px 14px 12px;text-align:center;opacity:0;transition:var(--tr)}
.m-card:hover .voir{opacity:1}
.m-info{padding:16px 18px}
.m-info h3{font-size:17px;margin-bottom:4px}
.m-info .desc{font-size:12.5px;color:var(--grey);line-height:1.5;margin-bottom:10px}
.m-info .usage{font-size:11px;font-weight:800;color:var(--violet);background:rgba(108,92,231,.1);border-radius:99px;padding:4px 10px;display:inline-block}

/* How + footer */
.how{background:var(--surface);padding:56px 0}
.how h2{text-align:center;font-size:clamp(22px,4vw,30px);margin-bottom:36px}
.how-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.how-step{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:24px;position:relative;box-shadow:var(--sh)}
.how-step .n{position:absolute;top:-16px;left:20px;width:34px;height:34px;border-radius:50%;background:var(--gold);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800}
.how-step .em{font-size:32px;margin-bottom:10px}
.how-step h3{font-size:16px;margin-bottom:6px}
.how-step p{font-size:13.5px;color:var(--grey)}
footer{background:var(--ink-3);color:#AEB6C8;margin-top:0}
.foot-bottom{padding:20px;text-align:center;font-size:12.5px;color:#7A8294}
.notfound{text-align:center;padding:140px 20px}
.notfound .em{font-size:70px;display:block;margin-bottom:16px}
@media(max-width:900px){.g-hero{padding:116px 0 30px}}
</style></head>
<body data-header="force">
<main id="contenu"></main>
<footer><div class="foot-bottom">© 2026 Mukanda · Brazzaville, Congo · Un projet de l'équipe Meurphy</div></footer>
<script src="registre.js"></script>
<script>
const $=s=>document.querySelector(s);
const TYPE=new URLSearchParams(location.search).get('type')||'';
const DOC=window.REGISTRE[TYPE];
const fcfa=n=>new Intl.NumberFormat('fr-FR').format(n||0)+' F';

if(!DOC){
  document.getElementById('contenu').innerHTML=`<div class="notfound"><span class="em">🦜</span>
    <h1>Ce type n'existe pas</h1>
    <p style="color:var(--grey);margin-bottom:22px">Retourne à l'accueil pour voir les modèles disponibles.</p>
    <a class="btn btn-grad" href="index.html">🏠 Retour à l'accueil</a></div>`;
}else{
  const remise=Math.round((1-DOC.prixPack/(DOC.prixUnit*DOC.modeles.length))*100);
  document.title=DOC.titre+' · Mukanda';
  document.getElementById('contenu').innerHTML=`
  <section class="g-hero"><div class="wrap g-hero-in">
    <div>
      <div class="bread"><a href="index.html">🏠 Accueil</a><span>›</span><a href="index.html#pro">Modèles pro</a><span>›</span><span>${DOC.titre}</span></div>
      <h1>${DOC.em} ${DOC.titre} <span style="background:var(--gold);color:var(--ink);padding:2px 16px;border-radius:14px;display:inline-block;transform:rotate(-1.5deg)">en exemplaires</span></h1>
      <div class="sub">${DOC.desc}</div>
      <div class="g-stats">
        <div><span class="num">${DOC.modeles.length}</span><span class="lbl">modèles</span></div>
        <div><span class="num">${fcfa(DOC.prixUnit)}</span><span class="lbl">le document</span></div>
        <div><span class="num">${fcfa(DOC.prixPack)}</span><span class="lbl">le pack complet</span></div>
        <div><span class="num">15 s</span><span class="lbl">pour télécharger</span></div>
      </div>
    </div>
    <div class="pack">
      <div class="kick">💎 Pack complet</div>
      <h3>Tous les ${DOC.modeles.length} modèles</h3>
      <p>+ guide d'utilisation + support WhatsApp gratuit.</p>
      <ul><li>Tous les exemplaires en un clic</li><li>Accès à vie, mises à jour incluses</li><li>Guide de personnalisation</li><li>Support WhatsApp de l'équipe</li></ul>
      <div class="row"><span class="now">${fcfa(DOC.prixPack)}</span><span class="old">${fcfa(DOC.prixUnit*DOC.modeles.length)}</span><span class="save">-${remise}%</span></div>
      <a class="btn btn-gold btn-block" href="paiement.html?type=pack&id=${TYPE}">🛒 Acheter le pack complet</a>
    </div>
  </div></section>

  <section class="grid-sec"><div class="wrap">
    <div class="grid-head">
      <div><h2>Choisis ton exemplaire</h2><div class="sub">Aperçus réels — clique pour personnaliser.</div></div>
    </div>
    <div class="m-grid">
      ${DOC.modeles.map(m=>`
      <a class="m-card" href="exemplaire.html?type=${TYPE}&modele=${m.id}">
        <div class="m-prev">
          ${m.badge?`<span class="badge">${m.badge}</span>`:''}
          <div class="m-scale" data-rendu="${m.id}"></div>
          <div class="voir">👁️ Personnaliser ce modèle →</div>
        </div>
        <div class="m-info">
          <h3>${m.nom}</h3>
          <div class="desc">${m.desc}</div>
          <span class="usage">${m.usage}</span>
        </div>
      </a>`).join('')}
    </div>
  </div></section>

  <section class="how"><div class="wrap">
    <h2>✨ Comment ça marche</h2>
    <div class="how-grid">
      <div class="how-step"><span class="n">1</span><span class="em">👁️</span><h3>Tu prévisualises</h3><p>Aperçu réel du document, gratuit, avant de payer.</p></div>
      <div class="how-step"><span class="n">2</span><span class="em">✏️</span><h3>Tu personnalises</h3><p>Tes infos remplacent l'exemple, le document se refait en direct.</p></div>
      <div class="how-step"><span class="n">3</span><span class="em">💳</span><h3>Tu paies ${fcfa(DOC.prixUnit)}</h3><p>MoMo ou Airtel en 15 secondes, téléphone qui sonne.</p></div>
      <div class="how-step"><span class="n">4</span><span class="em">📥</span><h3>Tu télécharges</h3><p>PDF généré instantanément avec TES données.</p></div>
    </div>
  </div></section>`;

  /* Injecte les VRAIS aperçus miniatures + échelle */
  requestAnimationFrame(()=>{
    document.querySelectorAll('.m-scale').forEach(el=>{
      const m=DOC.modeles.find(x=>x.id==el.dataset.rendu);
      if(!m)return;
      el.innerHTML=m.rendu(JSON.parse(JSON.stringify(DOC.defaut)));
      const doc=el.querySelector('.doc-a4');
      const prev=el.parentElement;
      const sc=prev.clientWidth/doc.offsetWidth;
      el.style.width=doc.offsetWidth+'px';
      el.style.transform='scale('+sc+')';
    });
  });
}
</script>
<script src="header.js"></script>
</body>
</html>
